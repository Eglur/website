name: Council probe (temporary)
on: pull_request
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="EglurBriefing/0.1 (+https://www.eglurtech.com)"
          get() { echo "===== $1"; curl -s -A "$UA" "$1" | tr -s ' \r\n\t' ' ' | head -c ${2:-3000}; echo; }
          P=https://mgenglish.pembrokeshire.gov.uk/mgWebService.asmx
          C=https://council.ceredigion.gov.uk/mgWebService.asmx
          get "$P" 9000 | grep -oE 'op=[A-Za-z]+' | sort -u | tr '\n' ' '; echo
          get "$P/GetCommittees?lCommitteeType=0" 40000 | grep -oE '<committeeid>[0-9]+</committeeid> <committeetitle>[^<]+</committeetitle> <committeedeleted>[^<]+</committeedeleted> <committeeexpired>[^<]+</committeeexpired> <committeecategory>[^<]+' | head -60
          get "$P/GetMeetings?lCommitteeId=281&sFromDate=01/11/2026&sToDate=31/12/2026" 4000
          get "$C/GetCommittees?lCommitteeType=0" 8000 | grep -oE '<committeeid>[0-9]+</committeeid> <committeetitle>[^<]+' | head -20
          get "$C/GetMeetings?lCommitteeId=148&sFromDate=01/11/2026&sToDate=31/12/2026" 4000
          MID=$(curl -s -A "$UA" "$P/GetMeetings?lCommitteeId=281&sFromDate=01/11/2026&sToDate=31/12/2026" | grep -oE '<meetingid>[0-9]+' | head -1 | grep -oE '[0-9]+')
          echo "meeting id: $MID"
          get "$P/GetMeeting?lMeetingId=$MID" 6000
