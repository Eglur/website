name: Senedd probe (temporary)
on: pull_request
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Show the layout of a Senedd written-questions page
        run: |
          for d in 25-11-2026 20-11-2026; do
            curl -sL -A "EglurBriefing/0.1" "https://record.senedd.wales/OrderPaper/WrittenQuestions/$d" -o page.html
            echo "=== $d: $(wc -c < page.html) bytes, WQ count: $(grep -o 'WQ[0-9]\{5,6\}' page.html | sort -u | wc -l)"
            python3 - <<'PY'
          import re
          h = open("page.html", encoding="utf-8", errors="replace").read()
          i = h.find("WQ1")
          start = h.rfind("<h2", 0, i) if h.rfind("<h2", 0, i) > 0 else max(0, i - 3000)
          print(h[start:start + 9000])
          j = h.find("Answered by")
          print("=== ANSWERED SAMPLE ===")
          print(h[max(0, j - 3500): j + 2500] if j > 0 else "none")
          PY
          done
