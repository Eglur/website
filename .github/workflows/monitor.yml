name: Morning briefing

# Builds the Eglur morning briefing and publishes it at /monitor/ on this site.
on:
  schedule:
    - cron: "40 5 * * 1-5"   # 05:40 UTC on weekdays (06:40 in summer), ready before the office day
  workflow_dispatch: {}       # the "Run workflow" button
  push:                       # also runs when the briefing's code or settings change
    branches: [main]
    paths: ["tools/monitor/**", ".github/workflows/monitor.yml"]

permissions:
  contents: write   # to save the briefing into /monitor
  pages: write      # to ask GitHub Pages to republish the site

concurrency:
  group: morning-briefing
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r tools/monitor/requirements.txt

      - name: Build the briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/monitor/monitor.py --out monitor

      - name: Publish to the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor/
          if git diff --cached --quiet; then echo "No changes to publish."; exit 0; fi
          git commit -m "Morning briefing $(date -u +%F)"
          git pull --rebase origin main   # in case the site changed while this ran
          git push origin HEAD:main
          # Pushes made by a workflow don't republish GitHub Pages on their own, so ask for it.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" \
            || echo "::warning::Couldn't request a Pages rebuild. The briefing will appear on the next site update."
