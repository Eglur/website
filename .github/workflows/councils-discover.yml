name: Discover council meeting systems

on:
  workflow_dispatch:          # run by hand to look again for councils not yet found
  schedule:
    - cron: "17 3 1 * *"      # and monthly, as councils change systems

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/monitor/councils/discover.py
      - name: Save the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/monitor/councils/councils.json tools/monitor/councils/not_found.txt
          git diff --cached --quiet && exit 0
          git commit -m "Council discovery results $(date -u +%F)"
          git push origin HEAD:${GITHUB_REF_NAME}
