name: Eglur Daily emails

on:
  schedule:
    - cron: "10 6 * * 1-5"   # 06:10 UTC on weekdays (07:10 in summer)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the emails but don't send them"
        type: boolean
        default: true
      only:
        description: "Send to this one subscriber only (optional)"
        type: string
        default: ""

permissions:
  contents: write   # to save which items have been seen (daily-email/state.json)

concurrency:
  group: eglur-daily-emails
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/monitor/requirements.txt
      - name: Build and send briefings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUBSCRIBERS_URL: ${{ secrets.SUBSCRIBERS_URL }}
          SUBSCRIBERS_TOKEN: ${{ secrets.SUBSCRIBERS_TOKEN }}
          # Eglur's shared public corpus (read-only). Until all three are set, Daily uses its own fetchers.
          EGLUR_CORPUS_URL: ${{ secrets.EGLUR_CORPUS_URL }}
          EGLUR_CORPUS_KEY: ${{ secrets.EGLUR_CORPUS_KEY }}
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          python tools/monitor/subscribers.py $ARGS
      - name: Keep the previews (dry runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: email-previews
          path: daily-email/preview/
          retention-days: 3
          if-no-files-found: ignore
      - name: Save what's been seen
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-email/state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Eglur Daily: seen items $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
