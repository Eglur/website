# Office profile: edit this to tailor the digest.
# This is an EXAMPLE profile. Replace it with the office you're testing for.

[office]
name = "Paul Davies MS, Ceredigion Penfro (demo profile from public sources, not affiliated)"
# Built from Paul Davies MS's public record (Senedd profile, his website and local press, November 2026).
description = """
Paul Davies MS, Welsh Conservative Member of the Senedd for Ceredigion Penfro (Ceredigion plus north
Pembrokeshire, including Cardigan, Newport, St Dogmaels and Fishguard), first elected in 2007; constituency
office in Haverfordwest. In the Welsh Conservative Senedd group he is Deputy Leader, Shadow Trefnydd, Chief Whip,
and Shadow Minister for the Welsh Language, Culture, Tourism and Sport.
Constituency priorities from his recent public campaigning: keeping services at Withybush (Haverfordwest) and
Bronglais (Aberystwyth) hospitals and Hywel Dda health board decisions; sewage discharges and water and bathing
water quality; bovine TB and farming; car parking charges and town-centre trade; bank branch closures in
Haverfordwest and Aberystwyth; full fibre broadband in west Wales; the Withyhedge landfill site; hospices and
palliative care; NHS dentistry; the visitor levy and tourism; young farmers and rural communities.
Portfolio interests: Welsh language, culture, tourism and sport, and Senedd business management.
Westminster items matter when they affect Wales, west Wales, farming, rural services or his portfolio.
"""

[member]
name = "Paul Davies MS"
# The member's own news page: the briefing reads their latest statements as context.
website_news = "https://www.paul-davies.org.uk/news"
# Draft a short social media post for the strongest items (AI draft, for the office to edit).
social_drafts = true

[filter]
# Items mentioning any of these go through to AI scoring. Not case-sensitive.
# A plain word matches the whole word plus plurals: "GP" matches GP and GPs, not "GPS".
# End with * to match word beginnings: "farm*" matches farm, farmer, farming.
# Leave empty to send everything (more cost, more noise).
keywords = [
  # place
  "Wales", "Ceredigion", "Penfro", "Pembrokeshire", "Aberystwyth", "Cardigan", "Aberteifi", "Fishguard", "Abergwaun",
  "Goodwick", "St Dogmaels", "Haverfordwest", "Hwlffordd", "Lampeter", "Aberaeron", "Llandysul", "Tregaron", "New Quay",
  "west Wales", "Mid and West Wales",
  # health
  "Withybush", "Bronglais", "Hywel Dda", "hospice*", "palliative", "dentist*", "dental", "GP",
  # environment, farming, rural
  "sewage", "water quality", "bathing water", "Welsh Water", "Dŵr Cymru", "bovine TB", "farm*", "agricultur*",
  "livestock", "young farmers", "rural", "Withyhedge", "landfill",
  # economy and services
  "car parking", "parking charge*", "bank branch*", "broadband", "full fibre", "visitor levy", "tourism", "town centre*",
  "Fishguard port", "Stena", "Irish Sea",
  # portfolio
  "Welsh language", "Cymraeg", "S4C", "Eisteddfod", "culture", "sport", "Trefnydd",
]
# Hard cap on items sent to the AI per run (controls cost).
max_items = 120
# Items scoring at or above this go in the digest (0–10).
min_score = 6

[sources]
written_questions = true
written_statements = true
bills = true
commons_divisions = true
senedd_written_questions = true
look_ahead = true   # Westminster committee sessions, debates and bill stages in the coming week

[model]
# Model used to score and summarise. One batched call per ~30 items.
name = "claude-sonnet-5-5"
